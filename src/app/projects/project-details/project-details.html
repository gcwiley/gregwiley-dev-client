@if (project(); as project) {
<mat-card class="project-details-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Project Details</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <mat-list role="list" aria-label="Project Details">
      <!-- status -->
      <mat-list-item lines="2" role="listitem">
        <mat-icon matListItemIcon aria-label="Status info icon">info</mat-icon>
        <span matListItemTitle>Status</span>
        <span matListItemLine>{{ project.status }}</span>
      </mat-list-item>

      <mat-divider></mat-divider>

      <!-- category -->
      <mat-list-item lines="2" role="listitem">
        <mat-icon matListItemIcon aria-label="category icon">category</mat-icon>
        <span matListItemTitle>Category</span>
        <span matListItemLine>{{ project.category }}</span>
      </mat-list-item>

      <mat-divider></mat-divider>

      <!-- language used -->
      <mat-list-item lines="2" role="listitem">
        <mat-icon matListItemIcon aria-label="code icon">code</mat-icon>
        <span matListItemTitle>Language Used</span>
        <span matListItemLine>{{ project.programmingLanguage }}</span>
      </mat-list-item>

      <mat-divider></mat-divider>

      <!-- gitUrl -->
      <mat-list-item lines="2" role="listitem">
        <mat-icon matListItemIcon aria-label="link icon">link</mat-icon>
        <span matListItemTitle>Git Repo</span>
        <a
          [href]="project.gitUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open GitHub repository for {{ project.title }}"
          >{{ project.gitUrl ? 'View on GitHub' : 'Not available' }}</a
        >
      </mat-list-item>
    </mat-list>
  </mat-card-content>
</mat-card>
}
