@if (projects$ | async; as projectList) { @if (projectList.length > 0) {
<div class="project-grid-container">
  @for (project of projectList; track project._id) {
  <mat-card appearance="outlined" class="project-card">
    <mat-card-header>
      <mat-card-title>{{ project.title }}</mat-card-title>
      <mat-card-subtitle>{{ project.category }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ project.programmingLanguage }}</p>
    </mat-card-content>

    <span class="flex-spacer"></span>

    <mat-card-actions>
      <button matButton [routerLink]="['/projects', project._id]">OPEN</button>
    </mat-card-actions>
  </mat-card>
  }
</div>

} @else {
<!-- Empty State -->
<div class="empty-message">
  <mat-icon>sentiment_dissatisfied</mat-icon>
  <p>No posts found.</p>
</div>
} } @else {
<!-- Loading State -->
<div class="spinner-container">
  <mat-spinner diameter="50"></mat-spinner>
</div>
}
