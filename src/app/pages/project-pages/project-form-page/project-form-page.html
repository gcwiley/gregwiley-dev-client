<header>
  <app-navbar></app-navbar>
</header>

<main
  class="project-form-page-container"
  aria-label="Create Project Page"
  role="main">
  <article class="main-content">
    <div class="page-header">
      <a
        routerLink="/projects"
        class="back-link"
        aria-label="Back to all projects">
        <mat-icon>arrow_back</mat-icon>
        <span>All Projects</span>
      </a>
    </div>
    <app-project-form></app-project-form>
  </article>

  <aside
    class="side-content"
    role="complementary"
    aria-label="Recent Projects">
    <app-recent-projects [recentProjects]="recentProjects()"></app-recent-projects>
  </aside>
</main>

<app-footer></app-footer>
