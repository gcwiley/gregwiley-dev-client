<header>
  <app-navbar></app-navbar>
</header>

<main class="project-details-page-container" aria-label="Project Details Page">
  @if (project$ | async; as project) {
  <article class="main-content">
    <button
      mat-icon-button
      class="back-button"
      (click)="goBack()"
      aria-label="Back to Projects">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <app-project-description [project]="project"></app-project-description>
  </article>

  <aside class="side-content">
    <app-project-details [project]="project"></app-project-details>
    <mat-divider></mat-divider>
    <app-project-tags></app-project-tags>
  </aside>
  } @else {
  <div class="loading-spinner-container">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
  }
</main>

<app-footer></app-footer>
