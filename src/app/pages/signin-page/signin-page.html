<main class="signin-page-container" aria-label="Sign In Page">
  <mat-card class="signin-form" appearance="raised">
    <div class="title-text">
      <h1>Welcome</h1>
      <p>Sign in to access the admin panel.</p>
    </div>
    <mat-card-content class="card-content">
      <button
        matButton="outlined"
        class="google-sign-in-button"
        type="button"
        [disabled]="googleLoading()"
        (click)="onSignInWithGoogle()">
        @if (googleLoading()) {
          Signing in...
        } @else {
          <img src="/logos/google-logo.svg" alt="Google logo" class="google-logo" />
          Sign in with Google
        }
      </button>
    </mat-card-content>
    <mat-card-footer
      class="signin-footer"
      role="contentinfo"
      aria-label="Copyright">
      <small>&copy; {{ year }} Gregory Wiley. All rights reserved.</small>
    </mat-card-footer>
  </mat-card>
</main>
